name: Bug report
description: Something did not work the way it should have.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The exact command you ran, or the steps you took in the UI.
      placeholder: notion-bg generate "My Title" --palette ocean
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `notion-bg --version`.
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - uv / uvx
        - pipx
        - pip
        - Homebrew
        - Downloaded binary
        - From a git clone
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1, Ubuntu 24.04, Windows 11
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Any error message, in full. Add `--json` if it was a generate command.
      render: shell
