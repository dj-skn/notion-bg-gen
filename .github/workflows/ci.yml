name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install
        run: uv pip install --system -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy

  test:
    name: Test ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Cover the other platforms once rather than across every version:
          # the code is pure Python and the wheels it depends on are well tested.
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install
        run: uv pip install --system -e ".[dev]"

      - name: Test
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  smoke:
    name: Smoke test the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install
        run: uv pip install --system .

      - name: Generate a cover and check the JSON contract
        run: |
          notion-bg --version
          notion-bg palettes --json > palettes.json
          notion-bg styles --json > styles.json
          notion-bg generate "CI Smoke Test" --size cover --seed 1 --json > result.json
          python - <<'PY'
          import json, pathlib
          result = json.loads(pathlib.Path("result.json").read_text())
          cover = result["covers"][0]
          assert result["count"] == 1, result
          assert cover["seed"] == 1, cover
          assert cover["written"] is True, cover
          assert pathlib.Path(cover["path"]).is_file(), cover
          assert json.loads(pathlib.Path("palettes.json").read_text())["palettes"], "no palettes"
          assert json.loads(pathlib.Path("styles.json").read_text())["styles"], "no styles"
          print("CLI contract OK:", cover["path"], cover["bytes"], "bytes")
          PY

      - name: A bare invocation must not open the UI when there is no terminal
        run: |
          set +e
          notion-bg < /dev/null > out.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; cat out.txt; exit 1; }

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
