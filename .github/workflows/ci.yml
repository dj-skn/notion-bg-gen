name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # A venv rather than --system: the runner's Python is Debian-managed and
      # refuses system-wide installs under PEP 668.
      - name: Install
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    name: Test ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Cover the other platforms once rather than across every version:
          # the code is pure Python and the wheels it depends on are well tested.
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"

      - name: Test
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  smoke:
    name: Smoke test the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install from the built package
        run: |
          uv venv --python 3.13
          uv pip install .

      - name: Generate a cover and check the JSON contract
        run: |
          uv run notion-bg --version
          uv run notion-bg palettes --json > palettes.json
          uv run notion-bg styles --json > styles.json
          uv run notion-bg generate "CI Smoke Test" --size cover --seed 1 --json > result.json
          uv run python .github/scripts/check_contract.py

      - name: A bare invocation must not open the UI when there is no terminal
        run: |
          set +e
          uv run notion-bg < /dev/null > out.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; cat out.txt; exit 1; }

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The single check that branch protection requires. Requiring this one name,
  # rather than every job, means the ruleset does not need editing whenever the
  # test matrix changes.
  #
  # `if: always()` matters: GitHub treats a *skipped* required check as passing,
  # so a gate that skipped whenever an upstream job failed would let a red PR
  # merge. This job always runs and fails unless every job it depends on
  # actually succeeded.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, smoke, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "At least one required job did not succeed."
            exit 1
          fi
          echo "All jobs succeeded."
