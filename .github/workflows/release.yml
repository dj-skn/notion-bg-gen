name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (for a re-run)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Confirm the tag matches the packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match project version $VERSION"
            exit 1
          fi
          echo "Releasing $VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  binaries:
    name: Binary for ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            artifact: notion-bg
          - os: macos-latest
            target: macos-arm64
            artifact: notion-bg
          - os: windows-latest
            target: windows-x86_64
            artifact: notion-bg.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Freeze
        run: >
          pyinstaller
          --onefile
          --name notion-bg
          --collect-data notion_bg_gen
          --collect-all textual
          --console
          packaging/entrypoint.py

      - name: Smoke test the binary
        shell: bash
        run: |
          ./dist/${{ matrix.artifact }} --version
          ./dist/${{ matrix.artifact }} generate "Binary Smoke" --size cover --seed 1 --quiet
          test -f covers/binary-smoke.jpg

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.artifact }}" out/
          cp README.md LICENSE out/
          cd out
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../notion-bg-${{ github.ref_name }}-${{ matrix.target }}.zip" ./*
          else
            tar -czf "../notion-bg-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" ./*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            notion-bg-*.tar.gz
            notion-bg-*.zip

  pypi:
    name: Publish to PyPI
    needs: [build, binaries]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/notion-bg-gen
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so the
      # repository never stores a long-lived API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: Attach binaries to the release
    needs: [pypi, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: artifacts

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false

  homebrew:
    name: Bump the Homebrew tap
    needs: github_release
    runs-on: ubuntu-latest
    # Requires a dj-skn/homebrew-tap repository and a HOMEBREW_TAP_TOKEN secret
    # with contents:write on it. Skipped automatically until both exist.
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Check for the tap token
        id: guard
        run: |
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No HOMEBREW_TAP_TOKEN set; skipping the tap bump."
          fi

      - name: Bump the formula
        if: steps.guard.outputs.ready == 'true'
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: notion-bg
          formula-path: Formula/notion-bg.rb
          homebrew-tap: dj-skn/homebrew-tap
          download-url: https://files.pythonhosted.org/packages/source/n/notion-bg-gen/notion_bg_gen-${{ github.ref_name }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
