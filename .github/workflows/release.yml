name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (for a re-run)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Confirm the tag matches the packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match project version $VERSION"
            exit 1
          fi
          echo "Releasing $VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  binaries:
    name: Binary for ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            artifact: notion-bg
          - os: macos-latest
            target: macos-arm64
            artifact: notion-bg
          - os: windows-latest
            target: windows-x86_64
            artifact: notion-bg.exe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      # --collect-all textual also drags in its metadata and binaries; data plus
      # submodules is what it actually needs at runtime. The excludes drop build
      # machinery and GUI toolkits that nothing here imports. Together with
      # --strip this takes roughly 3MB off macOS and more off Linux, where the
      # unstripped symbol tables dominate.
      - name: Freeze
        run: >
          pyinstaller
          --onefile
          --name notion-bg
          --console
          --strip
          --collect-data notion_bg_gen
          --collect-data textual
          --collect-submodules textual
          --exclude-module tkinter
          --exclude-module unittest
          --exclude-module doctest
          --exclude-module pydoc
          --exclude-module pdb
          --exclude-module lib2to3
          --exclude-module setuptools
          --exclude-module pip
          --exclude-module wheel
          --exclude-module numpy.f2py
          --exclude-module PIL.ImageQt
          --exclude-module PIL.ImageTk
          packaging/entrypoint.py

      - name: Smoke test the binary
        shell: bash
        run: |
          BIN=./dist/${{ matrix.artifact }}
          "$BIN" --version
          ls -l "$BIN" | awk '{printf "binary size: %.1f MB\n", $5/1048576}'

          # Exercise the trimmed parts: every style, every format, and the
          # bundled font and palette data, which excludes could quietly drop.
          for style in mesh aurora blobs linear; do
            "$BIN" generate "Smoke $style" --style "$style" --size 300x120 --seed 1 --quiet
          done
          for fmt in jpg png webp; do
            "$BIN" generate "Fmt $fmt" --format "$fmt" --size 300x120 --quiet
          done
          "$BIN" palettes --json > /dev/null
          "$BIN" styles --json > /dev/null
          test -f covers/smoke-mesh.jpg
          test -f covers/fmt-webp.webp

          # The UI must refuse a non-terminal rather than hang the job.
          set +e
          "$BIN" ui < /dev/null > ui.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2 from ui, got $code"; cat ui.txt; exit 1; }

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.artifact }}" out/
          cp README.md LICENSE out/
          cd out
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../notion-bg-${{ github.ref_name }}-${{ matrix.target }}.zip" ./*
          else
            tar -czf "../notion-bg-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" ./*
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            notion-bg-*.tar.gz
            notion-bg-*.zip

  pypi:
    name: Publish to PyPI
    needs: [build, binaries]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/notion-bg-gen
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so the
      # repository never stores a long-lived API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: Attach binaries to the release
    needs: [binaries, pypi]
    # Runs even if the PyPI step failed. The binaries are already built, and a
    # publishing problem should not also cost the user their GitHub release.
    if: ${{ always() && needs.binaries.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: artifacts

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false

  homebrew:
    name: Bump the Homebrew tap
    needs: [pypi, github_release]
    runs-on: ubuntu-latest
    # The formula points at the PyPI sdist, so this only makes sense once the
    # publish succeeded. Requires a dj-skn/homebrew-tap repository and a
    # HOMEBREW_TAP_TOKEN secret with contents:write on it; skipped until both
    # exist rather than failing the release.
    if: ${{ github.event_name == 'push' && needs.pypi.result == 'success' }}
    steps:
      - name: Work out the version and check for the tap token
        id: guard
        run: |
          # The tag is v1.2.3 but the sdist is notion_bg_gen-1.2.3.tar.gz.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No HOMEBREW_TAP_TOKEN set; skipping the tap bump."
          fi

      - name: Bump the formula
        if: steps.guard.outputs.ready == 'true'
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: notion-bg
          formula-path: Formula/notion-bg.rb
          homebrew-tap: dj-skn/homebrew-tap
          download-url: https://files.pythonhosted.org/packages/source/n/notion-bg-gen/notion_bg_gen-${{ steps.guard.outputs.version }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
